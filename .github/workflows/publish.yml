# Reads the Google Sheet, commits the updated data files, then deploys the
# site to GitHub Pages. Runs every night, on every push to main, and on demand
# (Actions tab > "Publier le site" > Run workflow).
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC every night
  workflow_dispatch:

permissions:
  contents: write  # commit the refreshed data files
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Lire la feuille et générer le site
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      # A push made with GITHUB_TOKEN does not trigger this workflow again.
      - name: Enregistrer les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data modeles
          if git diff --cached --quiet; then
            echo "Aucun changement dans la feuille."
          else
            git commit -m "Synchro de la feuille"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
